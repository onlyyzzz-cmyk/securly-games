<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060612">
  <title>404 | securly games</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#060612; --cyan:#00f5ff; --pink:#ff4fd8; --text:#e8f7ff; --muted:#8ca6b8; }
    * { box-sizing:border-box; }
    body { display:grid; place-items:center; min-height:100vh; margin:0; overflow:hidden; background:radial-gradient(circle at 50% 45%,rgba(0,245,255,.1),transparent 34%),var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; text-align:center; }
    .error { width:min(620px,calc(100% - 32px)); padding:28px; }
    .code { margin:0; color:var(--cyan); font-family:Orbitron,monospace; font-size:clamp(5rem,20vw,10rem); font-weight:900; line-height:.9; letter-spacing:4px; text-shadow:0 0 28px rgba(0,245,255,.35); }
    h1 { margin:26px 0 10px; font-family:Orbitron,monospace; font-size:clamp(1.2rem,4vw,2rem); letter-spacing:2px; text-transform:uppercase; }
    p { margin:0 auto; max-width:430px; color:var(--muted); font-size:1.1rem; line-height:1.5; }
    a { display:inline-flex; margin-top:28px; padding:12px 18px; border:1px solid var(--cyan); border-radius:6px; color:#001014; background:var(--cyan); font-family:Orbitron,monospace; font-size:.72rem; font-weight:900; letter-spacing:1px; text-decoration:none; text-transform:uppercase; }
    a:hover { border-color:#fff; background:#fff; }
    .signal { width:110px; height:1px; margin:24px auto 0; background:linear-gradient(90deg,transparent,var(--pink),transparent); box-shadow:0 0 12px var(--pink); }
  </style>
</head>
<body>
  <main class="error">
    <p class="code">404</p>
    <h1>level not found</h1>
    <p>That page is not in the library. Head back to the main lobby and choose another game.</p>
    <a href="index.html">return to games</a>
    <div class="signal" aria-hidden="true"></div>
  </main>
</body>
</html>
