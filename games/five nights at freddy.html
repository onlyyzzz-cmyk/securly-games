<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Five Nights at Freddy's 1</title>
  <style>
    html,body{margin:0;min-height:100%;background:#1d1d1d}
    body{display:grid;place-items:center;text-align:center;overflow:hidden}
    #game-shell{width:min(100vw,1280px);display:grid;place-items:center}
    #MMFCanvas{display:block;width:min(100vw,1280px);height:auto;max-height:82vh;background:#000}
    #progress-container{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(280px,calc(100vw - 40px));padding:18px;background:rgba(0,0,0,.88);border-radius:10px;color:#fff;font:14px Arial,sans-serif;z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.35)}
    .progress-row{margin:8px 0;text-align:left}
    .progress-track{height:10px;background:#444;border-radius:6px;overflow:hidden}
    .progress-fill{height:100%;width:0;transition:width .2s}
    #download-bar{background:#3b82f6}#extract-bar{background:#10b981}
    #error{margin-top:12px;color:#ff9eae;line-height:1.4;display:none}
  </style>
</head>
<body>
  <div id="game-shell"><canvas id="MMFCanvas" width="1280" height="720">Your browser does not support Canvas.</canvas></div>
  <div id="progress-container">
    <div>Loading Five Nights at Freddy's 1</div>
    <div class="progress-row">Downloading <span id="download-text">0%</span><div class="progress-track"><div id="download-bar" class="progress-fill"></div></div></div>
    <div class="progress-row">Extracting <span id="extract-text">0%</span><div class="progress-track"><div id="extract-bar" class="progress-fill"></div></div></div>
    <div id="error"></div>
  </div>
  <script>
  (function(){
    'use strict';

    var REVISION='00f6bb1c3e5f991e654ac7d12ac8c7e573310878';
    var SOURCES=[
      'https://cdn.jsdelivr.net/gh/blazerida/fnaf@'+REVISION+'/1/',
      'https://raw.githack.com/blazerida/fnaf/'+REVISION+'/1/',
      'https://raw.githubusercontent.com/blazerida/fnaf/'+REVISION+'/1/'
    ];
    var ZIP_SOURCES=[
      'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
      'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
      'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
    ];
    var PARTS=8;
    var files=new Map();
    var progress=document.getElementById('progress-container');

    function setProgress(id,value){
      value=Math.max(0,Math.min(100,Math.round(value)));
      var bar=document.getElementById(id+'-bar');
      var text=document.getElementById(id+'-text');
      if(bar)bar.style.width=value+'%';
      if(text)text.textContent=value+'%';
    }
    function status(text){
      var title=progress&&progress.firstElementChild;
      if(title)title.textContent=text;
    }
    function fail(error){
      var message=error&&error.message?error.message:String(error);
      var element=document.getElementById('error');
      if(element){element.textContent='Could not load this game. '+message;element.style.display='block';}
    }
    function loadScript(urls){
      return new Promise(function(resolve,reject){
        var index=0;
        function next(){
          if(index>=urls.length){reject(new Error('all script sources failed'));return;}
          var script=document.createElement('script');
          var url=urls[index++];
          script.async=false;
          script.onload=function(){resolve(url);};
          script.onerror=function(){script.remove();next();};
          script.src=url;
          document.head.appendChild(script);
        }
        next();
      });
    }
    function fetchBytes(path){
      return new Promise(function(resolve,reject){
        var index=0;
        var lastError;
        function next(){
          if(index>=SOURCES.length){reject(lastError||new Error('all asset sources failed: '+path));return;}
          var url=SOURCES[index++]+path;
          fetch(url,{cache:'no-store'}).then(function(response){
            if(!response.ok)throw new Error('HTTP '+response.status+' for '+path);
            return response.arrayBuffer();
          }).then(resolve).catch(function(error){lastError=error;next();});
        }
        next();
      });
    }
    async function loadArchive(){
      var buffers=[];
      for(var i=1;i<=PARTS;i++){
        status('Downloading resource part '+i+' of '+PARTS);
        buffers.push(await fetchBytes('resources.zip.part'+i));
        setProgress('download',i/PARTS*100);
      }
      return new Blob(buffers,{type:'application/zip'});
    }
    function resource(value){
      if(typeof value!=='string')return value;
      var clean=value.split('#')[0].split('?')[0].replace(/\/+$/,'');
      var key=clean.slice(clean.lastIndexOf('/')+1);
      return files.get(clean)||files.get(key)||value;
    }
    function installInterceptors(){
      var originalFetch=window.fetch;
      window.fetch=function(input,init){
        var raw=typeof input==='string'?input:(input&&input.url);
        var mapped=resource(raw);
        if(mapped!==raw)return originalFetch.call(this,mapped,init);
        return originalFetch.apply(this,arguments);
      };

      var originalOpen=XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open=function(method,url){
        var args=Array.prototype.slice.call(arguments);
        args[1]=resource(url);
        return originalOpen.apply(this,args);
      };

      function patch(proto){
        if(!proto)return;
        var descriptor=Object.getOwnPropertyDescriptor(proto,'src');
        if(!descriptor||!descriptor.set)return;
        Object.defineProperty(proto,'src',{
          configurable:true,
          enumerable:descriptor.enumerable,
          get:descriptor.get,
          set:function(value){descriptor.set.call(this,resource(value));}
        });
      }
      [window.HTMLImageElement,window.HTMLAudioElement,window.HTMLVideoElement,window.HTMLSourceElement].forEach(function(type){patch(type&&type.prototype);});

      var originalSetAttribute=Element.prototype.setAttribute;
      Element.prototype.setAttribute=function(name,value){
        if(String(name).toLowerCase()==='src')value=resource(value);
        return originalSetAttribute.call(this,name,value);
      };
    }
    async function start(){
      try{
        await loadScript(ZIP_SOURCES);
        if(!window.JSZip)throw new Error('JSZip did not load');
        var archive=await loadArchive();
        status('Extracting game resources');
        var zip=await window.JSZip.loadAsync(archive);
        var names=Object.keys(zip.files).filter(function(name){return !zip.files[name].dir;});
        for(var i=0;i<names.length;i++){
          var name=names[i];
          var blob=await zip.files[name].async('blob');
          var url=URL.createObjectURL(blob);
          files.set(name,url);
          files.set(name.slice(name.lastIndexOf('/')+1),url);
          setProgress('extract',(i+1)/names.length*100);
        }
        installInterceptors();
        status('Starting game');
        await loadScript(SOURCES.map(function(base){return base+'Runtime.js';}));
        if(typeof window.Runtime!=='function')throw new Error('game runtime did not load');
        progress.style.display='none';
        new window.Runtime('MMFCanvas','resources/FNAF1HTML5.cch');
      }catch(error){fail(error);}
    }
    start();
  }());
  </script>
</body>
</html>
