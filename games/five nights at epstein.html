<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Five Nights at BIG E</title>
  <style>
    html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;overflow:hidden}
    #unity-container{position:relative;width:min(960px,100vw);height:min(600px,100vh);display:grid;place-items:center;background:#000}
    #unity-canvas{width:100%;height:100%;background:#000}
    #loading-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 40px));padding:20px;background:rgba(0,0,0,.9);border-radius:10px;text-align:center;z-index:5}
    #loading-bar{height:10px;margin-top:14px;background:#333;border-radius:6px;overflow:hidden}
    #loading-fill{height:100%;width:0;background:#10b981;transition:width .2s}
    #error{margin-top:12px;color:#ff9eae;line-height:1.4;display:none}
  </style>
</head>
<body>
  <div id="unity-container"><canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas></div>
  <div id="loading-panel"><div id="loading-text">Loading Five Nights at BIG E…</div><div id="loading-bar"><div id="loading-fill"></div></div><div id="error"></div></div>
  <script>
  (function(){
    'use strict';

    var REVISION='c9c8b513a27155bf37c4ab3dee74e99b12b895ba';
    var SOURCES=[
      'https://cdn.jsdelivr.net/gh/web-ports/fnae@'+REVISION+'/',
      'https://raw.githack.com/web-ports/fnae/'+REVISION+'/',
      'https://raw.githubusercontent.com/web-ports/fnae/'+REVISION+'/'
    ];
    var ASSETS_BASE=REVISION+'/';
    var PARTS=3;
    var panel=document.getElementById('loading-panel');
    var fill=document.getElementById('loading-fill');
    var text=document.getElementById('loading-text');
    var errorElement=document.getElementById('error');

    function setProgress(value){fill.style.width=Math.max(0,Math.min(100,Math.round(value)))+'%';}
    function setStatus(value){text.textContent=value;}
    function fail(error){
      errorElement.textContent='Could not load this game. '+(error&&error.message?error.message:String(error));
      errorElement.style.display='block';
    }
    function fetchBytes(path){
      return new Promise(function(resolve,reject){
        var index=0;
        var lastError;
        function next(){
          if(index>=SOURCES.length){reject(lastError||new Error('all asset sources failed: '+path));return;}
          var url=SOURCES[index++]+path;
          fetch(url,{cache:'no-store'}).then(function(response){
            if(!response.ok)throw new Error('HTTP '+response.status+' for '+path);
            return response.arrayBuffer();
          }).then(resolve).catch(function(current){lastError=current;next();});
        }
        next();
      });
    }
    async function mergeParts(name,type,start,span){
      var buffers=[];
      for(var i=1;i<=PARTS;i++){
        setStatus('Downloading '+name+' part '+i+' of '+PARTS+'…');
        buffers.push(await fetchBytes(name+'.part'+i));
        setProgress(start+i/PARTS*span);
      }
      return URL.createObjectURL(new Blob(buffers,{type:type}));
    }
    function loadScript(path){
      return new Promise(function(resolve,reject){
        var index=0;
        function next(){
          if(index>=SOURCES.length){reject(new Error('all loader sources failed'));return;}
          var base=SOURCES[index++];
          var script=document.createElement('script');
          script.async=false;
          script.src=base+path;
          script.onload=function(){resolve(base);};
          script.onerror=function(){script.remove();next();};
          document.head.appendChild(script);
        }
        next();
      });
    }
    function patchMedia(webmUrl){
      window.randomwebm=webmUrl;
      var originalSetAttribute=Element.prototype.setAttribute;
      function rewrite(value){
        if(typeof value!=='string')return value;
        return /202512191935\.(?:mp4|webm)(?:[?#]|$)/i.test(value)?webmUrl:value;
      }
      var descriptor=Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype,'src');
      if(descriptor&&descriptor.set){
        Object.defineProperty(HTMLMediaElement.prototype,'src',{
          configurable:true,
          enumerable:descriptor.enumerable,
          get:descriptor.get,
          set:function(value){descriptor.set.call(this,rewrite(value));}
        });
      }
      Element.prototype.setAttribute=function(name,value){
        if(String(name).toLowerCase()==='src')value=rewrite(value);
        return originalSetAttribute.call(this,name,value);
      };
    }
    async function start(){
      try{
        var dataUrl=await mergeParts('Build/fnae.data','application/octet-stream',0,25);
        var wasmUrl=await mergeParts('Build/fnae.wasm','application/wasm',25,30);
        var webmUrl=await mergeParts('StreamingAssets/202512191935.webm','video/webm',55,25);
        patchMedia(webmUrl);
        setStatus('Starting Unity…');
        var loaderBase=await loadScript('Build/fnae.loader.js');
        if(typeof window.createUnityInstance!=='function')throw new Error('Unity loader did not initialize');
        var canvas=document.getElementById('unity-canvas');
        var config={
          arguments:[],
          dataUrl:dataUrl,
          frameworkUrl:loaderBase+'Build/fnae.framework.js',
          codeUrl:wasmUrl,
          streamingAssetsUrl:loaderBase+'StreamingAssets/',
          companyName:'DefaultCompany',
          productName:'fnae',
          productVersion:'1.0',
          showBanner:function(message,type){if(type==='error')console.error(message);}
        };
        await window.createUnityInstance(canvas,config,function(progress){setProgress(80+progress*20);});
        panel.style.display='none';
      }catch(current){fail(current);}
    }
    start();
  }());
  </script>
</body>
</html>
