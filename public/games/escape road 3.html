<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubblfan/escape-road-3@main/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="game.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
  <title>Escape Road 3</title>
  <meta name="description" content="Escape Road 3">
  <style>
    .jss1:before { top:0; width:100%; filter:blur(16px); height:100%; content:""; display:block; opacity:.5; z-index:0; position:absolute; background-size:cover; background-image:url("loading.png"); }
  </style>
</head>
<body>
  <div id="unity-container" style="display:none"><canvas id="unity-canvas"></canvas></div>
  <div id="loadingBlock">
    <div id="loading-text" style="color:white;font-size:48px;font-family:cursive;text-align:center;margin-top:20px">LOADING...</div>
    <div class="jss31 jss34 jss1">
      <div style="position:absolute;font-family:Arial,Helvetica,sans-serif;bottom:10px;right:10px;font-size:18px;color:#fff;opacity:.5">26041006</div>
      <div class="spinner"></div>
      <div class="jss31 jss34 jss48" style="flex:1 1 0%"><div class="jss32"><div class="jss7 jss9 jss20 jss3"><div class="jss125"><div class="jss123"><img src="logo.png" alt="Escape Road 3"></div></div></div></div></div>
      <div class="jss31 jss34" style="flex:3 1 0%"><div class="jss32"><div class="jss31 jss34 jss39 jss50 gameloader"><div class="jss32"><div class="gameloader-game-name">Escape Road 3</div></div><div class="jss32"><div class="jss32 gameloader-logo"><img id="game-logo" src="loading.png" alt=""></div></div><div class="jss32"><div><div class="gameloader-progressbar"><div class="gameloader-progressbar-progress" id="progress_fill" style="width:0%"></div></div><div class="gameloader-progress-info">Game Loading...</div></div></div></div></div></div>
    </div>
  </div>
  <script>
    const loadingText = document.querySelector('#loading-text');
    let loadedBytes = 0;
    async function fetchWithProgress(url) {
      const response = await fetch(url);
      if (!response.ok || !response.body) throw new Error(`Unable to load ${url}`);
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        loadingText.textContent = `LOADING... ${(loadedBytes / (1024 * 1024)).toFixed(2)} MB / 162.42 MB`;
      }
      const buffer = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
      return buffer.buffer;
    }
    async function mergeFiles(parts, cacheKey) {
      const cache = await caches.open('escape-road-3-cache');
      const cached = await cache.match(cacheKey);
      if (cached) return URL.createObjectURL(await cached.blob());
      const blob = new Blob(await Promise.all(parts.map(fetchWithProgress)));
      await cache.put(cacheKey, new Response(blob));
      return URL.createObjectURL(blob);
    }
    function getParts(file, start, end) {
      return Array.from({ length: end - start + 1 }, (_, index) => `${file}.part${index + start}`);
    }
    (async () => {
      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts('Build/escape-road-3-v26041006.data', 1, 7), 'escape-road-3-v26041006.data'),
        mergeFiles(getParts('Build/escape-road-3-v26041006.wasm', 1, 3), 'escape-road-3-v26041006.wasm')
      ]);
      const buildUrl = 'Build';
      const config = {
        dataUrl, frameworkUrl:`${buildUrl}/escape-road-3-v26041006.framework.js`, codeUrl:wasmUrl,
        streamingAssetsUrl:'StreamingAssets', companyName:'ozgames.io', productName:'Escape Road 3', productVersion:'26041006', gameId:'escape-road-3', eventLog:false
      };
      const script = document.createElement('script');
      script.src = `${buildUrl}/escape-road-3-v26041006.loader.js`;
      script.onload = () => createUnityInstance(document.querySelector('#unity-canvas'), config, progress => {
        document.querySelector('#progress_fill').style.width = `${progress * 100}%`;
        document.querySelector('.gameloader-progress-info').textContent = progress >= .99 ? 'Game Loading ...' : `Downloading file: ${Math.round(progress * 100)}%`;
      }).then(() => {
        document.querySelector('#loadingBlock').style.display = 'none';
        document.querySelector('#unity-container').style.display = 'block';
        window.focus();
      }).catch(error => { document.querySelector('#loading-text').textContent = 'Game failed to load'; console.error(error); });
      script.onerror = () => { document.querySelector('#loading-text').textContent = 'Game failed to load'; };
      document.body.appendChild(script);
    })().catch(error => { loadingText.textContent = 'Game failed to load'; console.error(error); });
  </script>
</body>
</html>
