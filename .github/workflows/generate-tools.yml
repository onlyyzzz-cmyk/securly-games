name: Generate tools.json

on:
  push:
    paths:
      - 'tools/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate tools.json
        run: |
          python3 -c "import os, json; files = sorted([f for f in os.listdir('tools') if f.endswith('.html')]); print(json.dumps(files, indent=2))" > tools.json
          echo "Generated tools.json:"
          cat tools.json

      - name: Commit tools.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools.json
          if git diff --staged --quiet; then
            echo "No changes to tools.json"
          else
            git commit -m "chore: auto-update tools.json"
            git push
          fi