name: Generate games.json

on:
  push:
    paths:
      - 'games/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate games.json
        run: |
          python3 -c "import os, json; files = sorted([f for f in os.listdir('games') if f.endswith('.html')]); print(json.dumps(files, indent=2))" > games.json
          echo "Generated games.json:"
          cat games.json

      - name: Commit games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          if git diff --staged --quiet; then
            echo "No changes to games.json"
          else
            git commit -m "chore: auto-update games.json"
            git push
          fi