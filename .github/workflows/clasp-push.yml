name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    # Secrets are stored under the "securly" GitHub Environment.
    environment: securly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Build Apps Script output
        run: node scripts/build-gas.mjs

      # Service accounts can't push to Apps Script (Google rejects
      # updateContent for them — see google/clasp#1051). CI authenticates as
      # the owner's Google account using the refresh token produced once by
      # `clasp login --no-localhost` (~/.clasprc.json contents).
      - name: Write clasp credentials
        run: |
          mkdir -p "$HOME"
          echo "$CLASPRC_JSON" > "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push to Apps Script
        run: clasp push --force
