name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    # Secrets are stored under the "securly" GitHub Environment.
    environment: securly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      # Service accounts can't use `clasp login --creds` (that expects an
      # OAuth *client* file). The supported CI path is Application Default
      # Credentials via the `--adc` global flag.
      - name: Authenticate with service account
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CLASP_SERVICE_ACCOUNT }}

      - name: Push to Apps Script
        run: clasp push --force --adc
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
