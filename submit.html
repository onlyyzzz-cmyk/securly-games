<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Links</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* Default values, overridden by JS theme loader */
  --bg: #0a0a0f; --surface: #111118; --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.14);
  --accent: #00f5ff; --accent-dim: rgba(0,245,255,0.08); --accent-border: rgba(0,245,255,0.25);
  --text: #efefef; --muted: #4a4a5a; --muted2: #2a2a36; --bar-h: 52px;
  --danger: #ff4466; --danger-dim: rgba(255,68,102,0.08); --danger-border: rgba(255,68,102,0.25);
}
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; overflow-x: hidden; }

/* SVG Background Layer */
#bg-svg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
#bg-svg-layer svg { width: 100%; height: 100%; object-fit: cover; }

#bar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h);
  background: rgba(10,10,15,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 16px; z-index: 200;
}
#btn-back {
  display: flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--border);
  color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; padding: 5px 12px;
  border-radius: 6px; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; transition: border-color 0.2s, color 0.2s;
}
#btn-back:hover { border-color: var(--border-hover); color: var(--text); }
#bar-logo { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); flex: 1; }
#bar-badge { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; }
#live-dot { display: inline-flex; align-items: center; gap: 6px; }
#live-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--accent-border); } 70% { box-shadow: 0 0 0 8px rgba(0,0,0,0); } }

#wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: calc(var(--bar-h) + 36px) 16px 80px; }
#hero { margin-bottom: 36px; }
#hero-tag { display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); background: var(--accent-dim); border: 1px solid var(--accent-border); padding: 4px 12px; border-radius: 20px; margin-bottom: 14px; }
#hero h1 { font-size: clamp(26px,5vw,38px); font-weight: 800; letter-spacing: 0.02em; line-height: 1.1; margin-bottom: 10px; }
#hero h1 em { font-style: normal; color: var(--accent); }
#hero p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; line-height: 2; }

#tabs-wrap { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 5px; margin-bottom: 24px; }
.tab-btn { flex: 1; padding: 9px 8px; background: none; border: none; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-radius: 8px; transition: background 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.tab-btn.active { background: var(--accent); color: #000; font-weight: 700; }
.tab-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; display: none; }
.tab-btn.active .tab-dot { display: block; opacity: 1; }
.tab-count { font-size: 9px; opacity: 0.65; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

#notice { background: var(--accent-dim); border: 1px solid var(--accent-border); border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.07em; text-transform: uppercase; line-height: 2.2; }
#notice strong { display: block; font-size: 11px; margin-bottom: 2px; opacity: 0.7; }

#form-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: clamp(18px,4vw,28px); }
.field { margin-bottom: 16px; }
.field label { display: block; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 7px; }
.field input, .field textarea, .field select { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 10px 14px; border-radius: 8px; outline: none; letter-spacing: 0.04em; transition: border-color 0.2s, background 0.2s; -webkit-appearance: none; appearance: none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent-border); background: var(--accent-dim); }
.field textarea { resize: vertical; min-height: 72px; line-height: 1.7; }

#submit-btn { width: 100%; background: var(--accent); color: #000; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 700; padding: 13px; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s; }
#submit-btn:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 6px 24px var(--accent-dim); }

.sub-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; transition: border-color 0.2s; }
.sub-card:hover { border-color: var(--border-hover); }
.sub-badge { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border); }
.sub-link { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }

/* ... Rest of your existing CSS remains same ... */
#subs-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
#filter-btns { display: flex; gap: 6px; }
.filter-btn { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; }
.filter-btn.active { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }
</style>
</head>
<body>

<div id="bg-svg-layer"></div>

<div id="bar">
  <button id="btn-back">back</button>
  <div id="bar-logo">community</div>
  <div id="bar-badge"><span id="live-dot">live</span></div>
</div>

<div id="wrap">
  <div id="hero">
    <div id="hero-tag">public board</div>
    <h1>community <em>links</em></h1>
    <p>games · proxies · useful sites · anything unblocked</p>
  </div>

  <div id="tabs-wrap">
    <button class="tab-btn active" data-tab="browse"><span class="tab-dot"></span>browse <span class="tab-count" id="tc-browse">0</span></button>
    <button class="tab-btn" data-tab="submit">+ submit</button>
  </div>

  <div class="tab-panel active" id="panel-browse">
    <div id="subs-toolbar">
      <div id="filter-btns">
        <button class="filter-btn active" data-filter="all">all</button>
        <button class="filter-btn" data-filter="game">games</button>
        <button class="filter-btn" data-filter="proxy">proxies</button>
      </div>
      <span id="subs-total" style="font-family:'DM Mono'; font-size:9px; color:var(--muted)">0 links</span>
    </div>
    <div id="subs-list"></div>
    <div id="empty-state" style="display:none; text-align:center; padding:40px; color:var(--muted); font-family:'DM Mono'; font-size:10px;">no links found</div>
  </div>

  <div class="tab-panel" id="panel-submit">
    <div id="form-box">
      <div class="field"><label>type</label><select id="f-type"><option value="game">game</option><option value="proxy">proxy</option><option value="other">other</option></select></div>
      <div class="field"><label>title</label><input type="text" id="f-title" placeholder="Site Name"></div>
      <div class="field"><label>url</label><input type="text" id="f-link" placeholder="https://..."></div>
      <button id="submit-btn">submit link</button>
      <div id="form-status" style="text-align:center; margin-top:10px; font-size:10px; font-family:'DM Mono'"></div>
    </div>
  </div>
</div>

<script>
// --- CONFIG & UTILS ---
var SUPABASE_URL = 'https://rwiicjjzqqzhbjifaxtr.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3aWljamp6cXF6aGJqaWZheHRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDMwNTAsImV4cCI6MjA5MDMxOTA1MH0.UEZ-Stgq2roRfcCgwtsSgttThdcRIwC49VoDZD_N_bs';
var activeFilter = 'all';
var allData = [];

function esc(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// --- THEME ENGINE ---
const BG_THEMES = [
  { id:'cyber', accent:'#00f5ff', accentRgb:'0,245,255',
    svg:`<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="cg1" cx="20%" cy="30%" r="60%"><stop offset="0%" stop-color="#0d1a2e"/><stop offset="100%" stop-color="#060612"/></radialGradient></defs><rect width="1440" height="900" fill="url(#cg1)"/><g stroke="#00f5ff" stroke-opacity="0.06"><line x1="0" y1="100" x2="1440" y2="100"/><line x1="120" y1="0" x2="120" y2="900"/></g></svg>`
  },
  { id:'nebula', accent:'#ff6b9d', accentRgb:'255,107,157',
    svg:`<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><rect width="1440" height="900" fill="#0a001a"/><g fill="#ff6b9d" opacity="0.1"><ellipse cx="300" cy="300" rx="200" ry="150"/></g></svg>`
  },
  { id:'matrix', accent:'#00ff41', accentRgb:'0,255,65',
    svg:`<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><rect width="1440" height="900" fill="#000500"/><g fill="#00ff41" opacity="0.05"><rect x="50" y="0" width="1" height="900"/></g></svg>`
  }
];

function applyTheme(id) {
  const theme = BG_THEMES.find(t => t.id === id) || BG_THEMES[0];
  document.getElementById('bg-svg-layer').innerHTML = theme.svg;
  
  // Update CSS Variables to match theme accent
  const root = document.documentElement;
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--accent-dim', `rgba(${theme.accentRgb}, 0.08)`);
  root.style.setProperty('--accent-border', `rgba(${theme.accentRgb}, 0.25)`);
}

// --- DATA LOGIC ---
async function fetchLinks() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/submissions?select=*&order=created_at.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    return await res.json();
  } catch(e) { return []; }
}

function renderList(data) {
  const list = document.getElementById('subs-list');
  const filtered = activeFilter === 'all' ? data : data.filter(d => d.type === activeFilter);
  list.innerHTML = filtered.map(s => `
    <div class="sub-card">
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px">
        <span class="sub-badge">${esc(s.type)}</span>
        <strong style="font-size:13px">${esc(s.title)}</strong>
      </div>
      <a href="${esc(s.link)}" class="sub-link" target="_blank">${esc(s.link)}</a>
      ${s.msg ? `<div style="font-size:10px; color:var(--muted); font-family:'DM Mono'">${esc(s.msg)}</div>` : ''}
    </div>
  `).join('');
  document.getElementById('subs-total').textContent = filtered.length + ' links';
}

// --- INITIALIZE ---
(async function init() {
  const settings = JSON.parse(localStorage.getItem('sg_settings') || '{"bgTheme":"cyber"}');
  applyTheme(settings.bgTheme);
  
  allData = await fetchLinks();
  renderList(allData);
  document.getElementById('tc-browse').textContent = allData.length;
})();

// --- TAB SWITCHING ---
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn, .tab-panel').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('btn-back').addEventListener('click', () => { window.history.back(); });

// Apply low lag mode from settings
try {
  const saved = JSON.parse(localStorage.getItem('sg_settings') || '{}');
  if (saved.lowlag) document.documentElement.classList.add('lowlag');
} catch(e) {}
</script>
<style>
html.lowlag * {backdrop-filter: none !important; -webkit-backdrop-filter: none !important;}
html.lowlag .live-dot::before {animation: none !important;}
</style>
</body>
</html>
