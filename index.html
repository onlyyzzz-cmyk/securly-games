<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Securly Games</title>
<style>
body{min-height:100vh;margin:0;background:#17111d;color:#fff;font-family:Nunito,Arial,sans-serif}#cdn-app{max-width:1180px;margin:auto;padding:28px 20px 60px}.cdn-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.cdn-brand{font-size:clamp(1.8rem,5vw,3.2rem);font-weight:800}.cdn-sub{margin:4px 0;color:#c8b9ca}.cdn-nav,.cdn-card-actions{display:flex;gap:8px;flex-wrap:wrap}.cdn-nav a,.cdn-link{display:inline-block;padding:10px 14px;border:1px solid #ffffff29;border-radius:10px;background:#ffffff12;color:#fff;text-decoration:none;font-weight:700}.cdn-hero{margin:38px 0 24px;padding:28px;border:1px solid #ffffff1f;border-radius:18px;background:linear-gradient(135deg,#e8552f2e,#8b5cf61f)}.cdn-hero h1{margin:0 0 8px}.cdn-hero p{color:#d9cedd}.cdn-status{color:#f5bd7b;font-weight:700}.cdn-section{margin-top:28px}.cdn-section-head{display:flex;align-items:center;gap:12px}.cdn-section h2{font-size:1.25rem}.cdn-rule{height:1px;flex:1;background:#ffffff24}.cdn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.cdn-card{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid #ffffff1f;border-radius:14px;background:#ffffff0f}.cdn-card-name{font-weight:800;flex:1}.cdn-empty{padding:22px;border:1px dashed #ffffff33;border-radius:12px;color:#c8b9ca}.cdn-error{color:#ff9eae}.cdn-footer{margin-top:42px;color:#a99aae;font-size:.82rem}
</style></head><body><main id="cdn-app">
<header class="cdn-top"><div><div class="cdn-brand">🍕 pizza arcade</div><p class="cdn-sub">small games · good breaks · no fuss</p></div><nav class="cdn-nav"><a href="tools.html">tools</a><a href="tutorial.html">how to play</a><a href="credits.html">credits</a></nav></header>
<section class="cdn-hero"><h1>Welcome to Securly Games</h1><p>Games, tools, and pages loaded directly from GitHub through jsDelivr.</p><div id="cdn-status" class="cdn-status">Loading games.json…</div></section>
<section class="cdn-section"><div class="cdn-section-head"><h2>🎮 Games</h2><div class="cdn-rule"></div></div><div id="games-grid" class="cdn-grid"><div class="cdn-empty">Scanning the games catalog…</div></div></section>
<section class="cdn-section"><div class="cdn-section-head"><h2>🧰 Tools</h2><div class="cdn-rule"></div></div><div id="tools-grid" class="cdn-grid"><div class="cdn-empty">Loading tools…</div></div></section>
<footer class="cdn-footer">Static CDN build · GitHub main branch</footer></main>
<script>
(function(){
  'use strict';
  var ROOT='https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/';
  function cdn(path){return ROOT+String(path).replace(/^\/+/, '')+'?v='+Date.now();}
  function label(file){return String(file).replace(/\.html?$/i,'').replace(/[_\-+]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2');}
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function write(id,html){var element=document.getElementById(id);if(element)element.innerHTML=html;}
  function render(id,items,folder){
    if(!Array.isArray(items)||!items.length){write(id,'<div class=\"cdn-empty\">No files found.</div>');return;}
    write(id,items.map(function(file){var href=cdn(folder+'/'+encodeURIComponent(file));return '<article class=\"cdn-card\"><div class=\"cdn-card-name\">'+escapeHtml(label(file))+'</div><div class=\"cdn-card-actions\"><a class=\"cdn-link\" href=\"'+href+'\">Open</a><a class=\"cdn-link\" target=\"_blank\" rel=\"noopener\" href=\"'+href+'\">New tab</a></div></article>';}).join(''));
  }
  function fetchCatalog(file,id,folder){return fetch(cdn(file),{cache:'no-store'}).then(function(response){if(!response.ok)throw Error(response.status);return response.json();}).then(function(items){render(id,items,folder);return items;});}
  document.write('<p class=\"cdn-status\">Loading CDN catalogs…</p>');
  Promise.all([fetchCatalog('games.json','games-grid','games'),fetchCatalog('tools.json','tools-grid','tools')]).then(function(result){
    var status=document.getElementById('cdn-status');if(status)status.textContent=result[0].length+' games and '+result[1].length+' tools loaded from jsDelivr.';
  }).catch(function(error){var status=document.getElementById('cdn-status');if(status)status.innerHTML='<span class=\"cdn-error\">Could not load the CDN catalog.</span>';console.error(error);});
}());
</script></body></html>
