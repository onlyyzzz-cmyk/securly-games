<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDN Games Bookmarklet</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/classlink.com/math.svg">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#080810;color:#e2e8ff;font:16px Arial,sans-serif}.card{width:min(820px,100%);padding:28px;background:#10101e;border:1px solid #00f0ff44;border-radius:18px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;color:#00f0ff}p{color:#aab6d0;line-height:1.5}.code{width:100%;min-height:310px;padding:16px;background:#080810;color:#a5f3fc;border:1px solid #00f0ff44;border-radius:10px;font:12px/1.6 monospace;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a{padding:11px 15px;border:1px solid #00f0ff66;border-radius:9px;background:#00f0ff;color:#001018;font-weight:700;text-decoration:none;cursor:pointer}a{background:#ffffff12;color:#e2e8ff}.status{margin-top:14px;color:#7fffd4;min-height:22px}.error{color:#ff8fa3}</style>
</head>
<body>
  <main class="card">
    <h1>Games + Tools Bookmarklet</h1>
    <p>Copy this JavaScript bookmarklet. It opens <code>about:blank</code>, fetches both CDN JSON catalogs, and uses <code>document.write()</code> to render working links to every game and tool.</p>
    <textarea id="code" class="code" readonly></textarea>
    <div class="row"><button id="copy">Copy JavaScript</button><button id="test">Test about:blank</button><a href="index.html">Back to games</a></div>
    <div id="status" class="status"></div>
  </main>
  <script>
    (function(){
      'use strict';
      var javascript='javascript:(function(){var R="https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/";var w=window.open("about:blank","_blank");if(!w){alert("Allow pop-ups first.");return;}function esc(v){return String(v).replace(/[&<>"\\']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\\\"":"&quot;","\\\'":"&#39;"}[c]})}function name(v){return String(v).replace(/\\.html?$/i,"").replace(/[_\\-+]/g," ")}Promise.all([fetch(R+"games.json",{cache:"no-store"}).then(function(r){return r.json()}),fetch(R+"tools.json",{cache:"no-store"}).then(function(r){return r.json()})]).then(function(a){var html="<!doctype html><html><head><meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\"><title>Securly Games CDN</title><style>body{font:16px Arial;background:#17111d;color:#fff;padding:24px}a{color:#7dd3fc}li{margin:8px 0}</style></head><body><h1>Games + Tools</h1><h2>Games ("+a[0].length+")</h2><ul>"+a[0].map(function(f){return"<li><a href=\\""+R+"games/"+encodeURIComponent(f)+"\\">"+esc(name(f))+"</a></li>"}).join("")+"</ul><h2>Tools ("+a[1].length+")</h2><ul>"+a[1].map(function(f){return"<li><a href=\\""+R+"tools/"+encodeURIComponent(f)+"\\">"+esc(name(f))+"</a></li>"}).join("")+"</ul></body></html>";w.document.open();w.document.write(html);w.document.close()}).catch(function(e){w.document.open();w.document.write("<h1>CDN load failed</h1><p>"+e.message+"</p>");w.document.close()})})();';
      var code=document.getElementById('code');var status=document.getElementById('status');code.value=javascript;
      document.getElementById('copy').onclick=function(){code.select();navigator.clipboard.writeText(javascript).then(function(){status.textContent='Copied bookmarklet JavaScript.'}).catch(function(){document.execCommand('copy');status.textContent='Copied bookmarklet JavaScript.'})};
      document.getElementById('test').onclick=function(){var w=window.open('about:blank','_blank');if(!w){status.textContent='Allow pop-ups to test.';return}w.document.open();w.document.write('<!doctype html><html><body><h1>Testing CDN catalogs…</h1><script>fetch("https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/games.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(g){fetch("https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/tools.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(t){document.open();document.write("<h1>JavaScript works</h1><p>"+g.length+" games and "+t.length+" tools loaded.</p>");document.close()})})<\\/script></body></html>');w.document.close()};
      document.write('<p>✓ Bookmarklet ready: fetch + document.write + about:blank.</p>');
    }());
  </script>
</body>
</html>
