<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScript Bookmart</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/classlink.com/math.svg">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080810;color:#e2e8ff;font:16px Arial}.card{width:min(780px,100%);padding:28px;background:#10101e;border:1px solid #00f0ff44;border-radius:18px;box-shadow:0 20px 60px #0008}h1{color:#00f0ff}p{color:#aab6d0;line-height:1.5}.code{width:100%;min-height:260px;box-sizing:border-box;padding:16px;background:#080810;color:#a5f3fc;border:1px solid #00f0ff44;border-radius:10px;font:13px/1.6 monospace;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a{padding:11px 15px;border:1px solid #00f0ff66;border-radius:9px;background:#00f0ff;color:#001018;font-weight:700;text-decoration:none;cursor:pointer}a{background:#ffffff12;color:#e2e8ff}.status{margin-top:14px;color:#7fffd4;min-height:22px}.error{color:#ff8fa3}</style></head><body>
<main class="card"><h1>JavaScript Bookmart</h1><p>Copy this JavaScript bookmarklet. It opens <code>about:blank</code>, fetches the CDN index page, and writes the fetched HTML into the blank page.</p><textarea id="code" class="code" readonly></textarea><div class="row"><button id="copy">Copy JavaScript</button><button id="test">Test about:blank</button><a href="index.html">Back to games</a></div><div id="status" class="status"></div></main>
<script>
(function(){
  'use strict';
  var code='javascript:(function(){var w=window.open("about:blank","_blank");if(!w){alert("Allow pop-ups first.");return;}fetch("https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/index.html",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.text();}).then(function(html){w.document.open();w.document.write(html);w.document.close();}).catch(function(err){w.document.open();w.document.write("<h1>CDN load failed</h1><p>"+err.message+"</p>");w.document.close();});})();';
  var field=document.getElementById('code');
  var status=document.getElementById('status');
  field.value=code;
  document.getElementById('copy').onclick=function(){field.select();navigator.clipboard&&navigator.clipboard.writeText(code).then(function(){status.textContent='Copied bookmarklet JavaScript.'}).catch(function(){document.execCommand('copy');status.textContent='Copied bookmarklet JavaScript.'});};
  document.getElementById('test').onclick=function(){
    var w=window.open('about:blank','_blank');
    if(!w){status.textContent='Allow pop-ups to test about:blank.';return;}
    w.document.open();
    w.document.write('<!doctype html><html><head><title>CDN JavaScript Test</title></head><body><h1>JavaScript is running</h1><p id="result">Fetching index.html…</p><script>fetch("https://cdn.jsdelivr.net/gh/onlyyzzz-cmyk/securly-games@main/index.html",{cache:"no-store").then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.text();}).then(function(html){document.open();document.write(html);document.close();}).catch(function(e){document.getElementById("result").textContent="CDN fetch failed: "+e.message;});<\/script></body></html>');
    w.document.close();
  };
  document.write('<p>✓ Bookmarklet JavaScript loaded with document.write().</p>');
}());
</script></body></html>
