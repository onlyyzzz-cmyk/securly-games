<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loading...</title>
<meta name="robots" content="noindex">
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;text-align:center}code{color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
</head>
<body>
<div id="msg" style="display:none">
  <p style="font-size:1.1rem;font-weight:700;color:#fc2651;letter-spacing:2px;text-transform:uppercase">pizza arcade — go</p>
  <p style="color:#94a3b8;font-size:.85rem;line-height:1.8;max-width:520px">
    <code>go.html?d=&lt;base64 url&gt;</code> — redirect to the decoded URL<br>
    <code>go.html?c=&lt;base64 url&gt;</code> — cloak: fetch the target and render it here<br>
    Raw <code>https://…</code> URLs work too — no base64 needed.
  </p>
</div>
<script>
function getParam(name){
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
function decodeTarget(v){
  v = (v || '').trim();
  if (/^https?:\/\//i.test(v)) return v;
  try {
    var d = atob(v);
    if (/^https?:\/\//i.test(d)) return d;
  } catch (e) { /* not base64 */ }
  return '';
}
(function(){
  var cloak = getParam('c');
  var redir = getParam('d');
  var target = decodeTarget(cloak || redir);
  if (!target) {
    document.title = 'go';
    document.getElementById('msg').style.display = 'block';
    return;
  }
  if (cloak) {
    fetch(target).then(function(r){ return r.text(); }).then(function(t){
      document.open(); document.write(t); document.close();
    }).catch(function(){ location.replace(target); });
  } else {
    location.replace(target);
  }
})();
</script>
</body>
</html>
